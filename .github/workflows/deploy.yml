name: deploy
# Shared workflow checks pull requests; only a main push updates the live destination.
on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:
jobs:
  site:
    uses: KadenaNexus/homepage/.github/workflows/deploy-static.yml@main
    with:
      source: .
      files: "index.html nexus-mark.png favicon.ico apple-touch-icon.png"
      target: /var/www/quantum.kadena.ws
      url: https://quantum.kadena.ws/
    secrets: inherit
